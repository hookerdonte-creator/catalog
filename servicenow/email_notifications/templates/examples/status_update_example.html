<!--
  Example: Status Update notification (matches the style guide's
  "Status Update" mockup — no badge/icon, comment block, footer WITH CTAs).
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RITM01849026 has Been Cancelled</title>
</head>
<body style="margin:0; padding:0; background-color:#EDEDED;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#EDEDED;">
  <tr>
    <td align="center" style="padding:24px 12px;">

      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px; background-color:#FFFFFF; border:1px solid #DADDE2; border-radius:4px; overflow:hidden;">

        <!-- Header -->
        <tr>
          <td>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F5F5F5;">
              <tr>
                <td style="padding:20px 24px;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <td style="padding-right:12px;">
                        <img src="{{LOGO_URL}}" alt="NVIDIA" width="28" height="28" style="display:block; border:0;" />
                      </td>
                      <td style="padding-right:12px; border-right:1px solid #DADDE2; width:1px;">&nbsp;</td>
                      <td style="padding-left:12px; font-family:'NVIDIA Sans', Arial, Helvetica, sans-serif; font-size:16px; font-weight:normal; color:#000000;">
                        NVIDIA Help
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
              <tr>
                <td style="background-color:#76B900; height:4px; line-height:4px; font-size:0;">&nbsp;</td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Body — no badge/icon on Status Update notifications -->
        <tr>
          <td style="padding:24px;">

            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:24px;">
              <tr>
                <td style="font-family:'NVIDIA Sans', Arial, Helvetica, sans-serif; font-size:24px; font-weight:bold; color:#000000;">
                  RITM01849026 has Been Cancelled
                </td>
              </tr>
            </table>

            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:24px;">
              <tr>
                <td style="font-family:'NVIDIA Sans', Arial, Helvetica, sans-serif; font-size:16px; font-weight:normal; color:#000000;">
                  Hello John,
                </td>
              </tr>
            </table>

            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:24px;">
              <tr>
                <td style="font-family:'NVIDIA Sans', Arial, Helvetica, sans-serif; font-size:16px; font-weight:normal; color:#000000; line-height:1.5;">
                  Your request <a href="{{RECORD_URL}}" style="color:#76B900; font-weight:bold; text-decoration:underline;">RITM01849026</a> has been cancelled.
                </td>
              </tr>
            </table>

            <!-- Comment block — comments render as a labeled block instead
                 of the 2-column table used for other record fields. -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:24px;">
              <tr>
                <td style="padding-bottom:8px; font-family:'NVIDIA Sans', Arial, Helvetica, sans-serif; font-size:16px; font-weight:bold; color:#000000;">Comment:</td>
              </tr>
              <tr>
                <td style="padding-bottom:8px; font-family:'NVIDIA Sans', Arial, Helvetica, sans-serif; font-size:16px; font-weight:normal; color:#000000;">06/26/2026 23:27:27 PDT - Eike Jens</td>
              </tr>
              <tr>
                <td style="font-family:'NVIDIA Sans', Arial, Helvetica, sans-serif; font-size:16px; font-weight:normal; color:#000000;">End user cancelled.</td>
              </tr>
            </table>

          </td>
        </tr>

        <!-- Footer (with CTAs) -->
        <tr>
          <td>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F5F5F5; border-top:1px solid #E0E0E0;">
              <tr>
                <td align="center" style="padding:20px 24px 12px 24px;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <td style="padding:0 6px;">
                        <a href="{{MANAGE_PREFERENCES_URL}}" style="display:inline-block; padding:6px 16px; border:1px solid #76B900; border-radius:999px; font-family:'NVIDIA Sans', Arial, Helvetica, sans-serif; font-size:12px; font-weight:bold; color:#76B900; text-decoration:none;">Manage Preferences</a>
                      </td>
                      <td style="padding:0 6px;">
                        <a href="{{UNSUBSCRIBE_URL}}" style="display:inline-block; padding:6px 16px; border:1px solid #DADDE2; border-radius:999px; font-family:'NVIDIA Sans', Arial, Helvetica, sans-serif; font-size:12px; font-weight:bold; color:#4B4B4B; text-decoration:none;">Unsubscribe</a>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
              <tr>
                <td align="center" style="padding:0 24px 20px 24px; font-family:'NVIDIA Sans', Arial, Helvetica, sans-serif; font-size:12px; font-weight:normal; color:#4B4B4B;">
                  You're receiving this due to recent activity in NVIDIA Help.
                </td>
              </tr>
            </table>
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>
</body>
</html>
