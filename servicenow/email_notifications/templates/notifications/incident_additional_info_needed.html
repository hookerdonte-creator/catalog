<!--
  Notification: Additional Information Needed on Incident
  Body-only content (no header/footer) — expected to sit inside a
  notification that embeds the shared header/footer partials, e.g.:
    ${template:nvidia_help_header}
    ... this content ...
    ${template:nvidia_help_footer_no_ctas}
  Action Required type — the user must reply with more info, so it
  carries the badge and the no-CTAs footer (no unsubscribe on
  Action Required mail).
-->
<!-- Notification type label -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-bottom: 16px;">
<tr>
<td style="font-family: 'NVIDIA Sans', Arial, Helvetica, sans-serif; font-size: 14px; font-weight: bold; letter-spacing: 0.5px; color: #7B7B7B; text-transform: uppercase;">&#9888; Action Required</td>
</tr>
</table>

<!-- Email Heading -->
<h1 style="margin: 0 0 24px 0; font-family: 'NVIDIA Sans', Arial, Helvetica, sans-serif; font-size: 24px; font-weight: bold; color: #000000; line-height: 1.3;">Additional information is needed from you for ${number}</h1>

<!-- Greeting -->
<p style="margin: 0 0 24px 0; font-family: 'NVIDIA Sans', Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 400; color: #000000; line-height: 1.5;">Hello ${caller_id.first_name},</p>

<!-- Intro sentence with styled INC number link -->
<p style="margin: 0 0 24px 0; font-family: 'NVIDIA Sans', Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 400; color: #000000; line-height: 1.5;">Additional Information is needed from you to action your Incident. Please review the fulfillers&rsquo; comments and reply to this mail.</p>

<!-- Comment label -->
<p style="margin: 0 0 8px 0; font-family: 'NVIDIA Sans', Arial, Helvetica, sans-serif; font-size: 16px; font-weight: bold; color: #000000; line-height: 1.5;">Comment:</p>
<!-- Comment body — rendered by mail script -->
<p style="margin: 0; font-family: 'NVIDIA Sans', Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 400; color: #000000; line-height: 1.5;">${mail_script:it_single_comment_clean}</p>
