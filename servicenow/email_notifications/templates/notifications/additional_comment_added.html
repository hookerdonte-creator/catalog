<!--
  Notification: Additional Comment Added
  Body-only content (no header/footer) — expected to sit inside a
  notification that embeds the shared header/footer partials, e.g.:
    ${template:nvidia_help_header}
    ... this content ...
    ${template:nvidia_help_footer_no_ctas}
  Status Update type — no badge, no CTAs, no unsubscribe footer.
  Fixed per NOTIFICATION_STANDARDS.md (UAT/Grace review).
-->
<!-- Email Heading -->
<h1 style="margin: 0 0 24px 0; font-family: 'NVIDIA Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 24px; font-weight: bold; color: #000000; line-height: 1.3;">New Comment on ${number}</h1>

<!-- Greeting -->
<p style="margin: 0 0 24px 0; font-family: 'NVIDIA Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 400; color: #333333; line-height: 1.5;">Hello ${caller_id.first_name},</p>

<p style="margin: 0 0 24px 0; font-family: 'NVIDIA Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 400; color: #333333; line-height: 1.5;">You received a new comment on your incident.</p>

<!-- 2-column tabular content -->
<table role="presentation" border="0" width="100%" cellspacing="0" cellpadding="0" style="margin: 0 0 24px 0;">
<tbody>
<tr>
<td style="font-family: 'NVIDIA Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 400; color: #666666; width: 17.2137%; padding: 0 20px 8px 0; vertical-align: top; white-space: nowrap;" valign="top">Short Description:</td>
<td style="font-family: 'NVIDIA Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 400; color: #333333; line-height: 1.5; width: 82.7863%; padding: 0 0 8px 0; vertical-align: top;" valign="top">${short_description}</td>
</tr>
</tbody>
</table>

<!-- Comment label -->
<p style="margin: 0 0 8px 0; font-family: 'NVIDIA Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; color: #000000; line-height: 1.5;">Comment:</p>
<!-- Comment body — rendered by mail script -->
<p style="margin: 0; font-family: 'NVIDIA Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 400; color: #333333; line-height: 1.5;">${mail_script:it_single_comment_clean}</p>
