<!--
  Notification: Incident Opened On Behalf Of User
  Body-only content (no header/footer) — expected to sit inside a
  notification that embeds the shared header/footer partials, e.g.:
    ${template:nvidia_help_header}
    ... this content ...
    ${template:nvidia_help_footer_no_ctas}
  No badge (Status Update type, consistent with the other similar
  notifications in this set) — use the no-CTAs footer.
-->
<!-- Email Heading -->
<h1 style="margin: 0 0 24px 0; font-family: 'NVIDIA Sans', Arial, Helvetica, sans-serif; font-size: 24px; font-weight: bold; color: #000000; line-height: 1.3;">An incident has been opened on your behalf.</h1>

<!-- Greeting -->
<p style="margin: 0 0 24px 0; font-family: 'NVIDIA Sans', Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 400; color: #000000; line-height: 1.5;">Hello ${caller_id.first_name},</p>

<!-- Intro sentence with styled INC number link -->
<p style="margin: 0; font-family: 'NVIDIA Sans', Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 400; color: #000000; line-height: 1.5;">Incident ${mail_script:link_to_portal_nvidia} has been opened on your behalf.</p>
