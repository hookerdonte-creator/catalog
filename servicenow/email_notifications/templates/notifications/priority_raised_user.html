<!--
  Notification: Priority Raised - user
  Body-only content (no header/footer) — expected to sit inside a
  notification that embeds the shared header/footer partials, e.g.:
    ${template:nvidia_help_header}
    ... this content ...
    ${template:nvidia_help_footer_no_ctas}
-->
<!-- Email Heading -->

<h1 style="margin: 0 0 24px 0; font-family: 'NVIDIA Sans', Arial, Helvetica, sans-serif; font-size: 24px; font-weight: bold; color: #000000; line-height: 1.3;">Incident ${number} priority raised</h1>

<p style="margin: 0 0 24px 0; font-family: 'NVIDIA Sans', Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 400; color: #000000; line-height: 1.5;">Hello ${caller_id.first_name},</p>

<p style="margin: 0 0 24px 0; font-family: 'NVIDIA Sans', Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 400; color: #000000; line-height: 1.5;">The priority of your Incident has been raised from ${event.parm1} to ${event.parm2}.</p>

<!-- Tertiary CTA — link back to the ServiceNow platform -->

<p style="margin: 0 0 0 0; font-family: 'NVIDIA Sans', Arial, Helvetica, sans-serif; font-size: 16px; font-weight: bold; color: #76B900; line-height: 1.5;">${mail_script:link_to_portal}</p>
