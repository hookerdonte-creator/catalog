<!--
  Notification: PO Renewal Approval - PIC
  Body-only content (no header/footer) — expected to sit inside a
  notification that embeds the shared header/footer partials, e.g.:
    ${template:nvidia_help_header}
    ... this content ...
    ${template:nvidia_help_footer_no_ctas}
-->
<!-- Email Heading -->

<h1 style="margin: 0 0 24px 0; font-family: 'NVIDIA Sans', Arial, Helvetica, sans-serif; font-size: 24px; font-weight: bold; color: #000000; line-height: 1.3;">PO renewal approval needed</h1>

<p style="margin: 0 0 24px 0; font-family: 'NVIDIA Sans', Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 400; color: #000000; line-height: 1.5;">Hello ${approver.name},</p>

<p style="margin: 0 0 24px 0; font-family: 'NVIDIA Sans', Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 400; color: #000000; line-height: 1.5;">Please review the request and confirm whether the renewal is required by selecting the appropriate link below at your earliest convenience.</p>

<!-- 2-column tabular content -->

<table border="0" cellpadding="0" cellspacing="0" role="presentation" style="margin: 0 0 24px 0;" width="100%"><tr><td colspan="2" style="font-family: 'NVIDIA Sans', Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 400; color: #000000; padding: 0 0 8px 0; vertical-align: top;">${mail_script:po_renewal}</td></tr></table>

<!-- CTA Buttons -->

<table border="0" cellspacing="0" cellpadding="0">
<tbody>
<tr><td style="padding-right: 12px;"><!--[if mso]>
        <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml"
                     xmlns:w="urn:schemas-microsoft-com:office:word"
                     href="${approval.approveLink}"
                     style="height:46px;v-text-anchor:middle;width:180px;"
                     arcsize="9%"
                     strokecolor="#76b900"
                     fillcolor="#76b900">
          <w:anchorlock/>
          <center style="color:#ffffff;
                         font-family:Arial,Helvetica,sans-serif;
                         font-size:16px;
                         font-weight:700;">
            Accept
          </center>
        </v:roundrect>
        <![endif]--><!--[if !mso]><!--> <a style="display: inline-block; background-color: #76b900; color: #ffffff; font-family: 'NVIDIA Sans', Arial, Helvetica, sans-serif; font-size: 16px; font-weight: bold; text-decoration: none; padding: 12px 28px; border-radius: 4px; mso-hide: all;" href="${approval.approveLink}"><span style="color: #ffffff;">Accept</span></a> <!--<![endif]--></td><td><!--[if mso]>
        <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml"
                     xmlns:w="urn:schemas-microsoft-com:office:word"
                     href="${approval.rejectLink}"
                     style="height:46px;v-text-anchor:middle;width:180px;"
                     arcsize="9%"
                     strokecolor="#76b900"
                     fillcolor="#ffffff">
          <w:anchorlock/>
          <center style="color:#76b900;
                         font-family:Arial,Helvetica,sans-serif;
                         font-size:16px;
                         font-weight:700;">
            Reject
          </center>
        </v:roundrect>
        <![endif]--><!--[if !mso]><!--> <a style="display: inline-block; background-color: #ffffff; color: #76b900; font-family: 'NVIDIA Sans', Arial, Helvetica, sans-serif; font-size: 16px; font-weight: bold; text-decoration: none; padding: 11px 27px; border-radius: 4px; border: 1px solid #76b900; mso-hide: all;" href="${approval.rejectLink}"><span style="color: #76b900;">Reject</span></a> <!--<![endif]--></td></tr>
</tbody>
</table>
