<!-- Email Heading -->

<p style="margin: 0 0 24px 0; font-family: 'NVIDIA Sans', Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 400; color: #000000; line-height: 1.5;">There are unread message(s) on ${mail_script:nvidia_uri_ref_styled}.</p>
