<!--
  Notification: Incident Task Opened
  Body-only content (no header/footer) — expected to sit inside a
  notification that embeds the shared header/footer partials, e.g.:
    ${template:nvidia_help_header}
    ... this content ...
    ${template:nvidia_help_footer_no_ctas}
  Status Update type — no badge, no unsubscribe footer. The
  "take me to the incident" line is a tertiary (link-back-to-platform)
  CTA, so it gets the Link/Emphasis treatment (16px bold, brand-green)
  rather than plain body copy.
-->
<!-- Email Heading -->
<h1 style="margin: 0 0 24px 0; font-family: 'NVIDIA Sans', Arial, Helvetica, sans-serif; font-size: 24px; font-weight: bold; color: #000000; line-height: 1.3;">Incident task is opened</h1>

<!-- Greeting -->
<p style="margin: 0 0 24px 0; font-family: 'NVIDIA Sans', Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 400; color: #000000; line-height: 1.5;">Hello ${opened_by.first_name},</p>

<!-- Intro sentence -->
<p style="margin: 0 0 24px 0; font-family: 'NVIDIA Sans', Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 400; color: #000000; line-height: 1.5;">${number} is opened.</p>

<!-- Tertiary CTA — link back to the ServiceNow platform -->
<p style="margin: 0 0 24px 0; font-family: 'NVIDIA Sans', Arial, Helvetica, sans-serif; font-size: 16px; font-weight: bold; color: #76B900; line-height: 1.5;"><span data-teams="true">${mail_script:incident_task_take_me_to_the_incident}</span></p>

<p style="margin: 0; font-family: 'NVIDIA Sans', Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 400; color: #000000; line-height: 1.5;">${mail_script:incident_task_additional_details}</p>
